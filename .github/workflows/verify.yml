name: Verify Nudge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-contract-types.mjs --check
      - run: npm run typecheck
      - run: npm test
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Xcode (including XCTest)
        run: xcodebuild -version
      - run: swift test -Xswiftc -DNUDGE_INTERNAL_DIAGNOSTICS
      - run: swift run NudgeChecks
      - run: swift build -c release --product Nudge
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Swift wire encoding with shared schema
        run: node --experimental-strip-types scripts/check-swift-contract.ts
